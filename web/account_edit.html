{% extends "base.html" %}
{% block title %}Редактировать #{{ a.id }}{% endblock %}
{% block content %}
<a href="/accounts/{{ a.id }}" class="text-blue-600 hover:underline text-sm">← к аккаунту</a>
<h1 class="text-2xl font-bold mt-1 mb-4">Редактировать #{{ a.id }}</h1>

{% if error %}<p class="text-rose-600 mb-3">{{ error }}</p>{% endif %}

<form method="post" enctype="multipart/form-data"
      class="bg-white rounded-lg p-6 shadow grid grid-cols-1 md:grid-cols-2 gap-4">
  
  <div class="md:col-span-2">
    <label class="text-sm font-medium block mb-2">Тип аккаунта</label>
    <div class="flex gap-4">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="tier" value="standard" {% if a.tier != 'premium' %}checked{% endif %}>
        <span>🟢 Standard</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="tier" value="premium" {% if a.tier == 'premium' %}checked{% endif %}>
        <span>💎 Premium (со скинами)</span>
      </label>
    </div>
  </div>

  <div><label class="text-sm">Riot логин</label>
    <input name="login" required value="{{ a.login }}" class="w-full border rounded px-3 py-2 font-mono"></div>
    
  <div><label class="text-sm">Riot пароль</label>
    <input name="password" required value="{{ a.password }}" class="w-full border rounded px-3 py-2 font-mono"></div>
    
  <div><label class="text-sm">Riot ID (для трекера)</label>
    <input name="riot_id" value="{{ a.riot_id or '' }}" placeholder="Player#RU1" class="w-full border rounded px-3 py-2 font-mono"></div>
    
  <div><label class="text-sm">Ранг</label>
    <input name="rank" required value="{{ a.rank }}" class="w-full border rounded px-3 py-2"></div>
    
  <div><label class="text-sm">Email</label>
    <input name="email" value="{{ a.email or '' }}" class="w-full border rounded px-3 py-2 font-mono"></div>
    
  <div><label class="text-sm">Пароль от email</label>
    <input name="email_password" value="{{ a.email_password or '' }}" class="w-full border rounded px-3 py-2 font-mono"></div>

  <div class="grid grid-cols-3 gap-2 md:col-span-2">
    <div><label class="text-sm">3ч ₽</label>
      <input name="price_3h" required type="number" step="0.01" value="{{ a.price_3h }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="text-sm">6ч ₽</label>
      <input name="price_6h" required type="number" step="0.01" value="{{ a.price_6h }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="text-sm">12ч ₽</label>
      <input name="price_12h" required type="number" step="0.01" value="{{ a.price_12h }}" class="w-full border rounded px-3 py-2"></div>
  </div>

  <div class="md:col-span-2 border-t pt-4">
    <div class="text-sm mb-2">Текущее фото:</div>
    {% if a.photo_id %}
      <img src="/api/photo/{{ a.photo_id }}" class="w-32 h-32 object-cover rounded mb-2 border">
      <label class="text-sm flex items-center gap-2 cursor-pointer text-rose-600">
        <input type="checkbox" name="remove_photo" value="1">
        Удалить фото
      </label>
    {% else %}
      <div class="text-slate-500 text-sm mb-2">нет</div>
    {% endif %}
    <div class="mt-3">
      <label class="text-sm">Заменить фото (необязательно)</label>
      <input name="photo" type="file" accept="image/*" class="w-full border rounded px-3 py-2">
    </div>
  </div>

  <div class="md:col-span-2 mt-2">
    <button class="bg-slate-900 text-white px-5 py-2 rounded hover:bg-slate-700">Сохранить</button>
    <a href="/accounts/{{ a.id }}" class="ml-3 text-slate-500 hover:underline">Отмена</a>
  </div>
</form>
{% endblock %}
