<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}MyrShop Admin{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:'#1C1917', surface:'#262930', line:'#57534D', ink:'#EFEEED', muted:'#A8A29E', accent:'#F25B3A',
            ok:'#4ADE80', warn:'#FBBF24', bad:'#FB7185' },
  fontFamily: { sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','ui-monospace','monospace'] },
  boxShadow: { glow:'0 0 0 1px rgba(242,91,58,.45), 0 0 20px rgba(242,91,58,.25)' }
}}}
</script>
<style type="text/tailwindcss">
  @layer components {
    .card { @apply bg-surface border border-line/70 rounded-xl p-4 transition; }
    .card-hover:hover { @apply border-accent/60 shadow-glow; }
    .label { @apply block text-xs font-medium text-muted mb-1 uppercase tracking-wide; }
    .input { @apply w-full bg-bg border border-line rounded-lg px-3 py-2 text-sm text-ink placeholder:text-muted/70 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30; }
    .btn { @apply inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition; }
    .btn-primary { @apply bg-accent text-white hover:brightness-110 hover:shadow-glow; }
    .btn-ghost { @apply border border-line text-ink hover:border-accent hover:text-accent; }
    .btn-ok { @apply bg-emerald-600 text-white hover:bg-emerald-500; }
    .btn-danger { @apply border border-rose-500/50 text-bad hover:bg-rose-500/10; }
    .tbl { @apply w-full text-sm; }
    .tbl thead { @apply bg-bg/60 text-muted text-xs uppercase tracking-wide; }
    .tbl th { @apply px-3 py-2.5 text-left font-medium whitespace-nowrap; }
    .tbl td { @apply px-3 py-2.5 whitespace-nowrap; }
    .tbl tbody tr { @apply border-t border-line/50 transition-colors; }
    .tbl tbody tr:hover { @apply bg-accent/5; }
    .badge { @apply inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border; }
    .b-free { @apply text-ok border-ok/40 bg-ok/10; }
    .b-res { @apply text-warn border-warn/40 bg-warn/10; }
    .b-rent { @apply text-accent border-accent/50 bg-accent/10; }
    .b-pw { @apply text-bad border-bad/40 bg-bad/10; }
    .link { @apply text-accent hover:underline; }
    .num { @apply font-mono font-bold tracking-tight; }
  }
  @keyframes rise { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
  .rise > * { animation: rise .35s ease both; }
  .rise > *:nth-child(2){animation-delay:.05s} .rise > *:nth-child(3){animation-delay:.1s}
  .rise > *:nth-child(4){animation-delay:.15s} .rise > *:nth-child(5){animation-delay:.2s}
  .glow-text { text-shadow: 0 0 24px rgba(242,91,58,.45); }
  @media (prefers-reduced-motion: reduce){ .rise > * { animation:none } }
</style>
</head>
<body class="bg-bg text-ink font-sans min-h-screen antialiased">
<nav class="sticky top-0 z-40 bg-bg/90 backdrop-blur border-b border-line/70">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-1 overflow-x-auto whitespace-nowrap">
    <a href="/" class="flex items-center gap-2 font-bold mr-4 shrink-0">
      <span class="w-7 h-7 rounded-lg bg-accent grid place-items-center"><i data-lucide="gamepad-2" class="w-4 h-4 text-white"></i></span>
      MyrShop
    </a>
    <a href="/" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface inline-flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Дашборд</a>
    <a href="/accounts" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface inline-flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i>Аккаунты</a>
    <a href="/accounts/add" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface inline-flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Добавить</a>
    <a href="/password-change" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface inline-flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4"></i>Смена пароля</a>
    <a href="/export" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface inline-flex items-center gap-2"><i data-lucide="upload" class="w-4 h-4"></i>Экспорт</a>
    <a href="/logout" class="ml-auto px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent inline-flex items-center gap-2 shrink-0"><i data-lucide="log-out" class="w-4 h-4"></i>Выйти</a>
  </div>
</nav>

<div id="toasts" class="fixed top-16 right-4 left-4 sm:left-auto sm:w-80 space-y-2 z-50"></div>

<main class="max-w-6xl mx-auto px-4 py-6 rise">
  {% block content %}{% endblock %}
</main>

<footer class="max-w-6xl mx-auto px-4 pb-8 text-xs text-muted">MyrShop Admin</footer>

<script>
lucide.createIcons();
let lastId = 0;
async function pollNotifications() {
  try {
    const r = await fetch(`/api/notifications?since=${lastId}`);
    const events = await r.json();
    for (const e of events) {
      lastId = Math.max(lastId, e.id);
      showToast(e);
    }
  } catch (err) {}
  setTimeout(pollNotifications, 10000);
}
function showToast(e) {
  const styles = {
    info:    "border-line bg-surface",
    success: "border-ok/60 bg-surface shadow-[0_0_16px_rgba(74,222,128,.2)]",
    warning: "border-accent/70 bg-surface shadow-glow",
    danger:  "border-bad/60 bg-surface shadow-[0_0_16px_rgba(251,113,133,.2)]",
  };
  const div = document.createElement("div");
  div.className = `${styles[e.level] || styles.info} border-l-4 text-ink px-4 py-3 rounded-lg text-sm transition`;
  div.innerHTML = `<b>${e.title}</b>${e.text ? `<br><small class="text-muted">${e.text}</small>` : ""}`;
  document.getElementById("toasts").appendChild(div);
  setTimeout(() => { div.style.opacity = 0; setTimeout(() => div.remove(), 300); }, 6000);
}
pollNotifications();
</script>
</body>
</html>
