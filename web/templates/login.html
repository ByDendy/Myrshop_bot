<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1C1917',surface:'#262930',line:'#57534D',ink:'#EFEEED',muted:'#A8A29E',accent:'#F25B3A'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
</head>
<body class="bg-bg text-ink font-sans min-h-screen flex items-center justify-center p-4"
      style="background-image:radial-gradient(700px circle at 50% -5%,rgba(242,91,58,.25),transparent 60%),radial-gradient(500px circle at 90% 100%,rgba(242,91,58,.08),transparent 60%)">
<form method="post" class="p-8 rounded-2xl w-full max-w-sm border border-line/70"
      style="background:linear-gradient(180deg,#30343d,#23262d);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 30px 60px -20px #000,0 0 60px -10px rgba(242,91,58,.25)">
  <div class="w-12 h-12 rounded-xl grid place-items-center mb-4"
       style="background:linear-gradient(180deg,#ff7a50,#d9441f);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 20px -6px rgba(242,91,58,.7)"><i data-lucide="gamepad-2" class="text-white"></i></div>
  <h1 class="text-xl font-bold">MyrShop Admin</h1>
  <p class="text-sm text-muted mb-5">Введите пароль для входа</p>
  <input type="password" name="password" placeholder="Пароль" autofocus
         class="w-full border border-line rounded-lg px-3 py-2.5 mb-3 outline-none focus:border-accent focus:ring-2 focus:ring-accent/30"
         style="background:#171412;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)">
  {% if error %}<p class="text-rose-400 text-sm mb-3">{{ error }}</p>{% endif %}
  <button class="w-full text-white font-semibold py-2.5 rounded-lg hover:brightness-110 active:translate-y-px transition"
          style="background:linear-gradient(180deg,#ff7a50,#f25b3a 55%,#d9441f);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #9c2f12,0 10px 20px -8px rgba(242,91,58,.6)">Войти</button>
</form>
<script>lucide.createIcons()</script>
</body></html>
