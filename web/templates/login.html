<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/style.css">
</head><body class="bg-bg text-ink min-h-screen flex items-center justify-center p-4">
<form method="post" class="card p-8 w-full max-w-sm">
  <h1 class="text-xl font-bold mb-1">MyrShop Admin</h1>
  <p class="text-sm text-muted mb-5">Введите пароль для входа</p>
  <input type="password" name="password" placeholder="Пароль" autofocus class="input mb-3">
  {% if error %}<p class="text-bad text-sm mb-3">{{ error }}</p>{% endif %}
  <button class="btn btn-primary w-full">Войти</button>
</form>
</body></html>
