<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#1C1917',surface:'#262930',line:'#57534D',ink:'#EFEEED',muted:'#A8A29E',accent:'#F25B3A'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
</head>
<body class="bg-bg text-ink font-sans min-h-screen flex items-center justify-center p-4"
      style="background-image:radial-gradient(600px circle at 50% 0%,rgba(242,91,58,.18),transparent 60%)">
<form method="post" class="bg-surface border border-line/70 p-8 rounded-2xl w-full max-w-sm shadow-[0_0_40px_rgba(242,91,58,.12)]">
  <div class="w-11 h-11 rounded-xl bg-accent grid place-items-center mb-4"><i data-lucide="gamepad-2" class="text-white"></i></div>
  <h1 class="text-xl font-bold">MyrShop Admin</h1>
  <p class="text-sm text-muted mb-5">Введите пароль для входа</p>
  <input type="password" name="password" placeholder="Пароль" autofocus
         class="w-full bg-bg border border-line rounded-lg px-3 py-2.5 mb-3 outline-none focus:border-accent focus:ring-2 focus:ring-accent/30">
  {% if error %}<p class="text-rose-400 text-sm mb-3">{{ error }}</p>{% endif %}
  <button class="w-full bg-accent text-white font-semibold py-2.5 rounded-lg hover:brightness-110 transition">Войти</button>
</form>
<script>lucide.createIcons()</script>
</body></html>
