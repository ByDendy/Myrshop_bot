{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Добавить аккаунт</h1>
{% if error %}<p class="mb-3 px-4 py-2 rounded-lg border border-bad/50 bg-bad/10 text-bad text-sm">{{ error }}</p>{% endif %}

<form method="post" enctype="multipart/form-data" class="card !p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
  <div><label class="label">Riot логин</label><input name="login" required class="input font-mono"></div>
  <div><label class="label">Riot пароль</label><input name="password" required class="input font-mono"></div>
  <div><label class="label">Email</label><input name="email" class="input font-mono"></div>
  <div><label class="label">Пароль от email</label><input name="email_password" class="input font-mono"></div>
  <div><label class="label">Ранг</label><input name="rank" required placeholder="Diamond 1" class="input"></div>
  <div class="grid grid-cols-3 gap-2">
    <div><label class="label">3ч ₽</label><input name="price_3h" required type="number" step="0.01" class="input font-mono"></div>
    <div><label class="label">6ч ₽</label><input name="price_6h" required type="number" step="0.01" class="input font-mono"></div>
    <div><label class="label">12ч ₽</label><input name="price_12h" required type="number" step="0.01" class="input font-mono"></div>
  </div>
  <div class="md:col-span-2">
    <label class="label">Фото аккаунта (необязательно)</label>
    <input name="photo" type="file" accept="image/*"
           class="input file:mr-3 file:px-3 file:py-1 file:rounded-md file:border-0 file:bg-accent file:text-white file:font-semibold file:cursor-pointer">
  </div>
  <div class="md:col-span-2 flex items-center gap-3">
    <button class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i>Добавить</button>
    <a href="/accounts" class="text-sm text-muted hover:text-accent">Отмена</a>
  </div>
</form>
{% endblock %}
