{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Добавить аккаунт</h1>

{% if error %}<p class="text-rose-600 mb-3">{{ error }}</p>{% endif %}

<form method="post" enctype="multipart/form-data"
      class="bg-white rounded-lg p-6 shadow grid grid-cols-1 md:grid-cols-2 gap-4">
  <div class="md:col-span-2">
    <label class="text-sm font-medium block mb-2">Тип аккаунта</label>
    <div class="flex gap-4">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="tier" value="standard" checked>
        <span>🟢 Standard</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="tier" value="premium">
        <span>💎 Premium (со скинами)</span>
      </label>
    </div>
  </div>
  <div><label class="text-sm">Riot логин</label>
    <input name="login" required class="w-full border rounded px-3 py-2"></div>
  <div><label class="text-sm">Riot пароль</label>
    <input name="password" required class="w-full border rounded px-3 py-2"></div>
  <div><label class="text-sm">Email</label>
    <input name="email" class="w-full border rounded px-3 py-2"></div>
  <div><label class="text-sm">Пароль от email</label>
    <input name="email_password" class="w-full border rounded px-3 py-2"></div>
  <div><label class="text-sm">Ранг</label>
    <input name="rank" required placeholder="Diamond 1" class="w-full border rounded px-3 py-2"></div>
  <div class="grid grid-cols-3 gap-2">
    <div><label class="text-sm">3ч ₽</label>
      <input name="price_3h" required type="number" step="0.01" class="w-full border rounded px-3 py-2"></div>
    <div><label class="text-sm">6ч ₽</label>
      <input name="price_6h" required type="number" step="0.01" class="w-full border rounded px-3 py-2"></div>
    <div><label class="text-sm">12ч ₽</label>
      <input name="price_12h" required type="number" step="0.01" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div class="md:col-span-2">
    <label class="text-sm">Фото аккаунта (необязательно)</label>
    <input name="photo" type="file" accept="image/*" class="w-full border rounded px-3 py-2">
  </div>
  <div class="md:col-span-2">
    <button class="bg-slate-900 text-white px-5 py-2 rounded">Добавить</button>
    <a href="/accounts" class="ml-3 text-slate-500">Отмена</a>
  </div>
</form>
{% endblock %}
